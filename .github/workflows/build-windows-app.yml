   name: Build Testsigma Demo App

   on:
     push:
       branches: [ main ]
     workflow_dispatch: {}

   jobs:
     build:
       runs-on: windows-latest

       steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Set up .NET 8 SDK
           uses: actions/setup-dotnet@v4
           with:
             dotnet-version: '8.0.x'

         - name: Restore
           run: dotnet restore TestsigmaDemoApp.csproj

         - name: Publish self-contained single-file exe
           run: >
             dotnet publish TestsigmaDemoApp.csproj
             -c Release
             -r win-x64
             --self-contained true
             -p:PublishSingleFile=true
             -p:IncludeNativeLibrariesForSelfExtract=true
             -o publish

         - name: Upload build artifact
           uses: actions/upload-artifact@v4
           with:
             name: TestsigmaDemoApp-win-x64
             path: publish/TestsigmaDemoApp.exe
